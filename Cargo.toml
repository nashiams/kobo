[workspace]
resolver = "2"
# v0.2 crate-boundary note:
# - kobo-transform must not depend on kobo-errors
# - kobo-transform must not depend on kobo-analysis
# - kobo-analysis must not depend on kobo-transform
members = [
    "crates/compiler/kobo-ir",
    "crates/compiler/kobo-parser",
    "crates/compiler/kobo-transform",
    "crates/compiler/kobo-analysis",
    "crates/compiler/kobo-migrate",
    "crates/compiler/kobo-codegen",
    "crates/compiler/kobo-debt",
    "crates/compiler/kobo-errors",
    "crates/compiler/kobo-driver",
    "crates/compiler/kobo-lsp",
    "crates/runtime/kobo-diag",
    "bin/kobo-cli",
]

[workspace.dependencies]
# Shared across crates — pin versions here, reference with dep = { workspace = true }
syn        = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote       = { version = "1" }
prettyplease = { version = "0.2" }
thiserror   = { version = "2" }
clap        = { version = "4", features = ["derive"] }
anyhow      = { version = "1" }
toml        = { version = "0.8" }
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1" }
insta       = { version = "1" }
