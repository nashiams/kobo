# Kobo workspace configuration
# All fields are optional; defaults shown here.

[kobo]
profile = "dev"

[guarantees]
ownership = "record"
liveness = "record"
replay = "record"
boundaries = "record"
errors = "ergonomic"

[diagnostics]
hot_borrow_threshold = 10000

[solver]
cluster_limit      = 2048
budget_seconds     = 5
lsp_budget_ms      = 200
