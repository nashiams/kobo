[package]
name    = "kobo-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kobo"
path = "src/main.rs"

[[bin]]
name = "kobo-lsp"
path = "src/bin/kobo-lsp.rs"

[dependencies]
kobo-driver  = { path = "../../crates/compiler/kobo-driver" }
kobo-errors  = { path = "../../crates/compiler/kobo-errors" }
kobo-lsp     = { path = "../../crates/compiler/kobo-lsp" }
kobo-codegen = { path = "../../crates/compiler/kobo-codegen" }
kobo-debt    = { path = "../../crates/compiler/kobo-debt" }
kobo-ir      = { path = "../../crates/compiler/kobo-ir" }
kobo-sim-core = { path = "../../crates/compiler/kobo-sim-core" }
kobo-migrate = { path = "../../crates/compiler/kobo-migrate" }
clap        = { workspace = true }
anyhow      = { workspace = true }
proc-macro2 = { workspace = true }
serde_json  = { workspace = true }
syn         = { workspace = true }
toml        = { workspace = true }
proptest    = { workspace = true }

[dev-dependencies]
insta       = { workspace = true }
serde_json  = { workspace = true }
